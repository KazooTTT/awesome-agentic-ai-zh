<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工程的五个控制问题</title>
  <desc id="desc">Prompt 和 Context 进入 Harness；Harness 让模型安全使用工具；Loop 根据证据决定继续、停止或问人；Workflow Graph 安排所有步骤、分支、返回路线和人工批准。这些责任会重叠，不是产品世代。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b1f4d" flood-opacity="0.13"/></filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1667c8"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ea6a00"/></marker>
    <marker id="graphArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#263b78"/></marker>
    <marker id="smallArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#263b78"/></marker>
    <style>text{font-family:"Source Han Sans CN","Microsoft YaHei",Arial,sans-serif;fill:#0b1f4d}.title{font-size:52px;font-weight:800}.subtitle{font-size:25px;font-weight:500}.head{font-size:31px;font-weight:800}.body{font-size:23px;font-weight:650}.small{font-size:20px;font-weight:600}.tiny{font-size:17px;font-weight:600}</style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf7"/>
  <text class="title" x="800" y="70" text-anchor="middle">Agent 工程：五个控制问题</text><text class="subtitle" x="800" y="112" text-anchor="middle">责任会重叠；不是五代产品，也不是章节顺序</text>
  <g filter="url(#shadow)"><rect x="55" y="165" width="330" height="135" rx="26" fill="#e8f5ff" stroke="#168bd2" stroke-width="4"/><text class="head" x="85" y="215" fill="#0876b6">Prompt</text><text class="body" x="85" y="257">把这一次的要求说清楚</text><rect x="55" y="330" width="330" height="135" rx="26" fill="#eefbea" stroke="#2f9e44" stroke-width="4"/><text class="head" x="85" y="380" fill="#237b35">Context</text><text class="body" x="85" y="422">放进这一步需要的资料</text></g>
  <path d="M385 233 H455" stroke="#168bd2" stroke-width="6" stroke-dasharray="11 9" marker-end="url(#blueArrow)"/><path d="M385 398 H455" stroke="#2f9e44" stroke-width="6" stroke-dasharray="11 9" marker-end="url(#blueArrow)"/>
  <g filter="url(#shadow)">
    <rect x="460" y="150" width="650" height="385" rx="30" fill="#faf5ff" stroke="#7447c8" stroke-width="5"/><text class="head" x="500" y="202" fill="#6337b7">Harness：让 Agent 安全做事的工作台</text>
    <rect x="500" y="235" width="250" height="86" rx="19" fill="#e8f5ff" stroke="#168bd2" stroke-width="3"/><text class="body" x="625" y="272" text-anchor="middle">模型产生决策</text><text class="tiny" x="625" y="302" text-anchor="middle">Model call</text>
    <rect x="815" y="235" width="250" height="86" rx="19" fill="#eefbea" stroke="#2f9e44" stroke-width="3"/><text class="body" x="940" y="272" text-anchor="middle">工具执行动作</text><text class="tiny" x="940" y="302" text-anchor="middle">Tools</text>
    <rect x="500" y="345" width="250" height="70" rx="18" fill="#fff1ee" stroke="#e65245" stroke-width="3"/><text class="small" x="625" y="389" text-anchor="middle">权限・Sandbox・错误</text>
    <rect x="815" y="345" width="250" height="70" rx="18" fill="#fff8df" stroke="#d99a00" stroke-width="3"/><text class="small" x="940" y="389" text-anchor="middle">State・Log・结果</text>
    <path d="M750 278 H808" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/><path d="M940 321 V338" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/><path d="M815 380 H758" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/><path d="M625 345 V327" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/>
    <rect x="505" y="440" width="555" height="67" rx="20" fill="#fff0df" stroke="#ea6a00" stroke-width="3"/><text class="body" x="782" y="482" text-anchor="middle" fill="#b64c00">Loop：做 → 看证据 → 继续／停止／问人</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="55" y="585" width="1490" height="215" rx="30" fill="#f5f8ff" stroke="#263b78" stroke-width="4"/><text class="head" x="90" y="630">Workflow Graph／Production Orchestration：安排整条路线</text>
    <g stroke="#263b78" stroke-width="6" fill="none" marker-end="url(#graphArrow)"><path d="M230 700 H425"/><path d="M625 700 H760"/><path d="M940 700 H1080"/><path d="M1275 700 H1410"/></g>
    <circle cx="175" cy="700" r="48" fill="#e8f5ff" stroke="#168bd2" stroke-width="4"/><text class="small" x="175" y="707" text-anchor="middle">开始</text>
    <rect x="425" y="650" width="200" height="100" rx="22" fill="#faf5ff" stroke="#7447c8" stroke-width="4"/><text class="small" x="525" y="692" text-anchor="middle">Harness</text><text class="tiny" x="525" y="722" text-anchor="middle">执行一轮</text>
    <rect x="760" y="650" width="180" height="100" rx="22" fill="#fff8df" stroke="#d99a00" stroke-width="4"/><text class="small" x="850" y="692" text-anchor="middle">检查证据</text><text class="tiny" x="850" y="722" text-anchor="middle">通过吗？</text>
    <rect x="1080" y="650" width="195" height="100" rx="22" fill="#fff1ee" stroke="#e65245" stroke-width="4"/><text class="small" x="1178" y="692" text-anchor="middle">人工批准</text><text class="tiny" x="1178" y="722" text-anchor="middle">高风险才暂停</text>
    <circle cx="1460" cy="700" r="48" fill="#eefbea" stroke="#2f9e44" stroke-width="4"/><text class="small" x="1460" y="707" text-anchor="middle">完成</text>
    <path d="M850 750 C850 790 525 790 525 758" fill="none" stroke="#ea6a00" stroke-width="6" marker-end="url(#orangeArrow)"/><text class="tiny" x="688" y="773" text-anchor="middle" fill="#b64c00">证据不足就回到下一轮</text>
  </g>
  <rect x="180" y="832" width="1240" height="48" rx="24" fill="#eaf2ff" stroke="#1667c8" stroke-width="2"/><text class="small" x="800" y="864" text-anchor="middle">Harness 让 Agent 能做事｜Loop 决定是否再做｜Graph 安排整条路线</text>
</svg>
