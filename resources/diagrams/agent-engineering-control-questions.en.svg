<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Five control questions in Agent engineering</title>
  <desc id="desc">Prompt and Context enter a Harness; the Harness lets a model use tools safely; a Loop uses evidence to continue, stop, or ask a person; a Workflow Graph arranges all steps, branches, return paths, and approvals. These responsibilities overlap and are not product generations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b1f4d" flood-opacity="0.13"/></filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1667c8"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ea6a00"/></marker>
    <marker id="graphArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#263b78"/></marker>
    <marker id="smallArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#263b78"/></marker>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#0b1f4d}.title{font-size:52px;font-weight:800}.subtitle{font-size:25px;font-weight:500}.head{font-size:29px;font-weight:800}.body{font-size:21px;font-weight:650}.small{font-size:18px;font-weight:600}.tiny{font-size:16px;font-weight:600}</style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf7"/>
  <text class="title" x="800" y="70" text-anchor="middle">Agent Engineering: Five Control Questions</text>
  <text class="subtitle" x="800" y="112" text-anchor="middle">Responsibilities overlap; these are not five product generations or chapter numbers</text>
  <g filter="url(#shadow)">
    <rect x="55" y="165" width="330" height="135" rx="26" fill="#e8f5ff" stroke="#168bd2" stroke-width="4"/><text class="head" x="85" y="215" fill="#0876b6">Prompt</text><text class="body" x="85" y="257">State the request clearly</text>
    <rect x="55" y="330" width="330" height="135" rx="26" fill="#eefbea" stroke="#2f9e44" stroke-width="4"/><text class="head" x="85" y="380" fill="#237b35">Context</text><text class="body" x="85" y="422">Supply this step's data</text>
  </g>
  <path d="M385 233 H455" stroke="#168bd2" stroke-width="6" stroke-dasharray="11 9" marker-end="url(#blueArrow)"/><path d="M385 398 H455" stroke="#2f9e44" stroke-width="6" stroke-dasharray="11 9" marker-end="url(#blueArrow)"/>
  <g filter="url(#shadow)">
    <rect x="460" y="150" width="650" height="385" rx="30" fill="#faf5ff" stroke="#7447c8" stroke-width="5"/><text class="head" x="500" y="202" fill="#6337b7">Harness: the Agent's safe workbench</text>
    <rect x="500" y="235" width="250" height="86" rx="19" fill="#e8f5ff" stroke="#168bd2" stroke-width="3"/><text class="body" x="625" y="272" text-anchor="middle">Model decides</text><text class="tiny" x="625" y="302" text-anchor="middle">Model call</text>
    <rect x="815" y="235" width="250" height="86" rx="19" fill="#eefbea" stroke="#2f9e44" stroke-width="3"/><text class="body" x="940" y="272" text-anchor="middle">Tools act</text><text class="tiny" x="940" y="302" text-anchor="middle">Tools</text>
    <rect x="500" y="345" width="250" height="70" rx="18" fill="#fff1ee" stroke="#e65245" stroke-width="3"/><text class="tiny" x="625" y="387" text-anchor="middle">Permissions · Sandbox · Errors</text>
    <rect x="815" y="345" width="250" height="70" rx="18" fill="#fff8df" stroke="#d99a00" stroke-width="3"/><text class="small" x="940" y="387" text-anchor="middle">State · Logs · Results</text>
    <path d="M750 278 H808" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/><path d="M940 321 V338" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/><path d="M815 380 H758" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/><path d="M625 345 V327" stroke="#263b78" stroke-width="5" marker-end="url(#smallArrow)"/>
    <rect x="505" y="440" width="555" height="67" rx="20" fill="#fff0df" stroke="#ea6a00" stroke-width="3"/><text class="small" x="782" y="482" text-anchor="middle" fill="#b64c00">Loop: act → inspect evidence → continue / stop / ask</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="55" y="585" width="1490" height="215" rx="30" fill="#f5f8ff" stroke="#263b78" stroke-width="4"/><text class="head" x="90" y="630">Workflow Graph / Production Orchestration: arrange the whole route</text>
    <g stroke="#263b78" stroke-width="6" fill="none" marker-end="url(#graphArrow)"><path d="M230 700 H425"/><path d="M625 700 H760"/><path d="M940 700 H1080"/><path d="M1275 700 H1410"/></g>
    <circle cx="175" cy="700" r="48" fill="#e8f5ff" stroke="#168bd2" stroke-width="4"/><text class="small" x="175" y="707" text-anchor="middle">Start</text>
    <rect x="425" y="650" width="200" height="100" rx="22" fill="#faf5ff" stroke="#7447c8" stroke-width="4"/><text class="small" x="525" y="692" text-anchor="middle">Harness</text><text class="tiny" x="525" y="722" text-anchor="middle">run one round</text>
    <rect x="760" y="650" width="180" height="100" rx="22" fill="#fff8df" stroke="#d99a00" stroke-width="4"/><text class="small" x="850" y="692" text-anchor="middle">Check evidence</text><text class="tiny" x="850" y="722" text-anchor="middle">Pass?</text>
    <rect x="1080" y="650" width="195" height="100" rx="22" fill="#fff1ee" stroke="#e65245" stroke-width="4"/><text class="small" x="1178" y="692" text-anchor="middle">Human approval</text><text class="tiny" x="1178" y="722" text-anchor="middle">pause for high risk</text>
    <circle cx="1460" cy="700" r="48" fill="#eefbea" stroke="#2f9e44" stroke-width="4"/><text class="small" x="1460" y="707" text-anchor="middle">Done</text>
    <path d="M850 750 C850 790 525 790 525 758" fill="none" stroke="#ea6a00" stroke-width="6" marker-end="url(#orangeArrow)"/><text class="tiny" x="688" y="773" text-anchor="middle" fill="#b64c00">Insufficient evidence starts another round</text>
  </g>
  <rect x="180" y="832" width="1240" height="48" rx="24" fill="#eaf2ff" stroke="#1667c8" stroke-width="2"/><text class="small" x="800" y="864" text-anchor="middle">Harness enables action | Loop decides whether to repeat | Graph arranges the route</text>
</svg>
